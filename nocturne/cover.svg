<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="55%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#06030a"/>
    </linearGradient>
    <radialGradient id="streetGlow" cx="0.5" cy="1" r="0.7">
      <stop offset="0%" stop-color="#9fd9ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9fd9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd089" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ff8c42" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9fd9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6ec8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffeac0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffeac0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- distant city skyline -->
  <g fill="#0a1024" opacity="0.85">
    <rect x="0"   y="240" width="60"  height="200"/>
    <rect x="60"  y="220" width="80"  height="220"/>
    <rect x="140" y="260" width="50"  height="180"/>
    <rect x="190" y="200" width="100" height="240"/>
    <rect x="290" y="240" width="70"  height="200"/>
    <rect x="360" y="180" width="120" height="260"/>
    <rect x="480" y="230" width="60"  height="210"/>
    <rect x="540" y="200" width="90"  height="240"/>
    <rect x="630" y="240" width="60"  height="200"/>
    <rect x="690" y="220" width="110" height="220"/>
  </g>
  <!-- scattered far windows -->
  <g fill="#9fd9ff" opacity="0.35">
    <rect x="22" y="290" width="4" height="4"/>
    <rect x="42" y="320" width="3" height="4"/>
    <rect x="82" y="260" width="4" height="4"/>
    <rect x="104" y="300" width="3" height="3"/>
    <rect x="220" y="240" width="4" height="4"/>
    <rect x="250" y="280" width="3" height="4"/>
    <rect x="380" y="220" width="4" height="3"/>
    <rect x="416" y="260" width="3" height="4"/>
    <rect x="450" y="240" width="4" height="4"/>
    <rect x="552" y="240" width="3" height="4"/>
    <rect x="588" y="270" width="4" height="3"/>
    <rect x="720" y="260" width="4" height="3"/>
    <rect x="744" y="300" width="3" height="4"/>
  </g>

  <!-- rain (thin diagonal strokes) -->
  <g stroke="#6ec8ff" stroke-width="0.6" opacity="0.18" stroke-linecap="round">
    <line x1="40"  y1="20"  x2="32"  y2="60"/>
    <line x1="90"  y1="10"  x2="82"  y2="46"/>
    <line x1="150" y1="30"  x2="142" y2="68"/>
    <line x1="220" y1="0"   x2="212" y2="40"/>
    <line x1="280" y1="20"  x2="272" y2="60"/>
    <line x1="360" y1="10"  x2="352" y2="48"/>
    <line x1="430" y1="0"   x2="422" y2="42"/>
    <line x1="500" y1="20"  x2="492" y2="58"/>
    <line x1="570" y1="10"  x2="562" y2="50"/>
    <line x1="640" y1="0"   x2="632" y2="40"/>
    <line x1="720" y1="20"  x2="712" y2="60"/>
    <line x1="780" y1="10"  x2="772" y2="48"/>
    <line x1="60"  y1="80"  x2="52"  y2="120"/>
    <line x1="130" y1="90"  x2="122" y2="130"/>
    <line x1="200" y1="80"  x2="192" y2="120"/>
    <line x1="320" y1="90"  x2="312" y2="130"/>
    <line x1="410" y1="80"  x2="402" y2="120"/>
    <line x1="510" y1="100" x2="502" y2="140"/>
    <line x1="600" y1="80"  x2="592" y2="120"/>
    <line x1="690" y1="100" x2="682" y2="140"/>
    <line x1="760" y1="90"  x2="752" y2="130"/>
  </g>

  <!-- foreground apartment building (the one you're investigating) -->
  <g>
    <rect x="190" y="120" width="420" height="440" fill="#0e0a1a" stroke="#1a1228" stroke-width="2"/>
    <!-- cornice -->
    <rect x="180" y="116" width="440" height="10" fill="#1a1228"/>
    <!-- subtle brick stripes -->
    <g stroke="#1a1228" stroke-width="1" opacity="0.6">
      <line x1="190" y1="200" x2="610" y2="200"/>
      <line x1="190" y1="290" x2="610" y2="290"/>
      <line x1="190" y1="380" x2="610" y2="380"/>
      <line x1="190" y1="470" x2="610" y2="470"/>
    </g>

    <!-- 5 windows, 1 per door (one lit warm, one lit cold, three dim) -->
    <!-- Window A (top-left, warm) -->
    <rect x="222" y="158" width="80" height="74" fill="#0a060e"/>
    <rect x="222" y="158" width="80" height="74" fill="url(#winGlow)"/>
    <rect x="222" y="158" width="80" height="74" fill="none" stroke="#3a2418" stroke-width="1.5"/>
    <line x1="262" y1="158" x2="262" y2="232" stroke="#3a2418" stroke-width="1"/>
    <line x1="222" y1="195" x2="302" y2="195" stroke="#3a2418" stroke-width="1"/>
    <!-- silhouette in window A -->
    <ellipse cx="248" cy="200" rx="9" ry="11" fill="#1a0e1a" opacity="0.7"/>
    <rect x="240" y="210" width="18" height="22" fill="#1a0e1a" opacity="0.7"/>

    <!-- Window B (top-right, cold) -->
    <rect x="498" y="158" width="80" height="74" fill="#0a060e"/>
    <rect x="498" y="158" width="80" height="74" fill="url(#winGlowB)"/>
    <rect x="498" y="158" width="80" height="74" fill="none" stroke="#2a3a4a" stroke-width="1.5"/>
    <line x1="538" y1="158" x2="538" y2="232" stroke="#2a3a4a" stroke-width="1"/>
    <line x1="498" y1="195" x2="578" y2="195" stroke="#2a3a4a" stroke-width="1"/>

    <!-- Window C (mid-left, dim) -->
    <rect x="222" y="304" width="80" height="74" fill="#100818" stroke="#1a1228" stroke-width="1.5"/>
    <line x1="262" y1="304" x2="262" y2="378" stroke="#1a1228" stroke-width="1"/>
    <line x1="222" y1="341" x2="302" y2="341" stroke="#1a1228" stroke-width="1"/>

    <!-- Window D (center, very dim — but tiny glint) -->
    <rect x="360" y="304" width="80" height="74" fill="#0a060e" stroke="#1a1228" stroke-width="1.5"/>
    <line x1="400" y1="304" x2="400" y2="378" stroke="#1a1228" stroke-width="1"/>
    <line x1="360" y1="341" x2="440" y2="341" stroke="#1a1228" stroke-width="1"/>
    <circle cx="392" cy="346" r="1.6" fill="#ff4d6d" opacity="0.9"/>

    <!-- Window E (mid-right, half-warm) -->
    <rect x="498" y="304" width="80" height="74" fill="#1a0e0e"/>
    <rect x="498" y="304" width="80" height="40" fill="url(#winGlow)" opacity="0.55"/>
    <rect x="498" y="304" width="80" height="74" fill="none" stroke="#3a2418" stroke-width="1.5"/>
    <line x1="538" y1="304" x2="538" y2="378" stroke="#3a2418" stroke-width="1"/>
    <line x1="498" y1="341" x2="578" y2="341" stroke="#3a2418" stroke-width="1"/>

    <!-- entrance: glass door, soft halo -->
    <rect x="360" y="440" width="80" height="120" fill="#0a1018"/>
    <rect x="360" y="440" width="80" height="120" fill="url(#winGlowB)" opacity="0.7"/>
    <rect x="360" y="440" width="80" height="120" fill="none" stroke="#2a3a4a" stroke-width="2"/>
    <line x1="400" y1="440" x2="400" y2="560" stroke="#2a3a4a" stroke-width="1.5"/>
    <!-- door number plate "5" -->
    <rect x="385" y="455" width="30" height="22" fill="#06030a" stroke="#ffd089" stroke-width="0.8" opacity="0.9"/>
    <text x="400" y="473" font-family="Georgia, serif" font-size="16" fill="#ffd089" text-anchor="middle" font-style="italic" opacity="0.95">5</text>

    <!-- street-level slabs / shadow -->
    <rect x="180" y="558" width="440" height="10" fill="#020408"/>

    <!-- street lamp on the left -->
    <circle cx="160" cy="430" r="42" fill="url(#lampGlow)"/>
    <rect x="158" y="430" width="4" height="130" fill="#1a1228"/>
    <circle cx="160" cy="430" r="6" fill="#ffeac0"/>
  </g>

  <!-- street wet glow -->
  <rect x="0" y="560" width="800" height="40" fill="url(#streetGlow)"/>

  <!-- silhouette: detective from behind, hat + coat, looking up at the building -->
  <g transform="translate(400, 575)">
    <ellipse cx="0" cy="6" rx="40" ry="5" fill="#000" opacity="0.55"/>
    <!-- coat -->
    <path d="M -32 4 L -28 -50 L -20 -82 L 20 -82 L 28 -50 L 32 4 Z" fill="#0a0610"/>
    <!-- shoulders / collar -->
    <path d="M -28 -50 L -10 -56 L 10 -56 L 28 -50 L 22 -42 L -22 -42 Z" fill="#06030a"/>
    <!-- neck -->
    <rect x="-6" y="-86" width="12" height="8" fill="#06030a"/>
    <!-- head -->
    <ellipse cx="0" cy="-94" rx="10" ry="10" fill="#1a0e18"/>
    <!-- fedora -->
    <path d="M -16 -98 L 16 -98 L 12 -110 L -12 -110 Z" fill="#06030a"/>
    <ellipse cx="0" cy="-98" rx="20" ry="3.5" fill="#06030a"/>
    <!-- cigarette ember -->
    <circle cx="13" cy="-95" r="1.4" fill="#ff4d6d" opacity="0.95"/>
    <ellipse cx="13" cy="-95" rx="6" ry="3" fill="#ff4d6d" opacity="0.18"/>
  </g>

  <!-- vignette + title -->
  <rect x="0" y="0" width="800" height="600" fill="url(#vignette)"/>

  <g>
    <text x="400" y="86" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="64" fill="#e8e0d0" text-anchor="middle" letter-spacing="4" opacity="0.96">
      Noc<tspan fill="#9fd9ff">turne</tspan>
    </text>
    <text x="400" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9fd9ff" text-anchor="middle" letter-spacing="10" opacity="0.85">— FIVE DOORS · ONE KILLER · ONE NIGHT —</text>
  </g>
</svg>
