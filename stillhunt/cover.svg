<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="55%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#2b2418"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.45" r="0.35">
      <stop offset="0%" stop-color="#ffc878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffc878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a14"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <rect width="400" height="300" fill="url(#sun)"/>

  <!-- distant treeline -->
  <g opacity="0.55" fill="#0c1018">
    <polygon points="0,180 20,150 40,170 65,140 90,165 115,135 140,160 165,138 190,158 215,140 240,162 265,138 290,155 315,140 340,158 365,142 400,160 400,200 0,200"/>
  </g>
  <!-- mid trees -->
  <g opacity="0.85" fill="#080a12">
    <polygon points="0,210 30,165 55,205 80,150 110,200 140,160 170,195 205,145 235,205 270,160 305,200 335,155 365,200 400,175 400,230 0,230"/>
  </g>

  <!-- mist band -->
  <rect x="0" y="180" width="400" height="40" fill="#7a8694" opacity="0.18"/>

  <!-- near tree silhouettes -->
  <g fill="#02030a">
    <rect x="40" y="120" width="6" height="170"/>
    <rect x="44" y="118" width="2" height="8" transform="rotate(-30 45 122)"/>
    <rect x="320" y="130" width="5" height="160"/>
    <rect x="200" y="100" width="8" height="190"/>
  </g>

  <!-- ground -->
  <rect y="220" width="400" height="80" fill="url(#ground)"/>

  <!-- deer silhouette mid-distance -->
  <g fill="#0e0a08" transform="translate(150 198)">
    <ellipse cx="20" cy="14" rx="22" ry="9"/>
    <ellipse cx="40" cy="9" rx="7" ry="6"/>
    <rect x="6" y="20" width="3" height="14"/>
    <rect x="14" y="20" width="3" height="14"/>
    <rect x="26" y="20" width="3" height="14"/>
    <rect x="34" y="20" width="3" height="14"/>
    <path d="M42 4 L40 -4 L44 -2 L44 -6 L48 -2 L46 4 Z M38 4 L36 -3 L40 -1 Z" stroke="#0e0a08" stroke-width="0.6" fill="#0e0a08"/>
  </g>

  <!-- crosshair -->
  <g stroke="#ffc878" stroke-width="1.2" fill="none" opacity="0.85">
    <circle cx="200" cy="150" r="14"/>
    <line x1="200" y1="130" x2="200" y2="142"/>
    <line x1="200" y1="158" x2="200" y2="170"/>
    <line x1="180" y1="150" x2="192" y2="150"/>
    <line x1="208" y1="150" x2="220" y2="150"/>
    <circle cx="200" cy="150" r="1.4" fill="#ffc878" stroke="none"/>
  </g>

  <!-- title -->
  <text x="200" y="56" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#f0e6d4" text-anchor="middle" letter-spacing="2">Stillhunt</text>
  <text x="200" y="78" font-family="Helvetica, sans-serif" font-size="9" fill="#ffc878" text-anchor="middle" letter-spacing="6">— DAWN ON THE RIDGE —</text>
</svg>
