<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3a1842"/>
      <stop offset="50%" stop-color="#1a0826"/>
      <stop offset="100%" stop-color="#0a0410"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fa2"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle stars -->
  <g fill="#f4ecf7" opacity="0.4">
    <circle cx="140" cy="120" r="1.4"/>
    <circle cx="280" cy="80" r="1"/>
    <circle cx="420" cy="180" r="1.2"/>
    <circle cx="980" cy="100" r="1"/>
    <circle cx="1080" cy="200" r="1.6"/>
    <circle cx="880" cy="60" r="1.2"/>
    <circle cx="180" cy="510" r="1.2"/>
    <circle cx="1020" cy="540" r="1.3"/>
  </g>
  <!-- bokeh -->
  <g opacity="0.45">
    <circle cx="200" cy="490" r="6" fill="#ff5fa2"/>
    <circle cx="320" cy="540" r="4" fill="#7fffd4"/>
    <circle cx="800" cy="520" r="5" fill="#ffd166"/>
    <circle cx="950" cy="480" r="4" fill="#ff5fa2"/>
    <circle cx="1080" cy="430" r="3" fill="#ffd166"/>
  </g>
  <!-- crown -->
  <text x="600" y="160" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="22" letter-spacing="14" fill="#ffd166" opacity="0.85">— OMENLY —</text>
  <!-- title -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="120" fill="url(#title)" style="text-shadow: 0 8px 40px rgba(255,95,162,0.5)">small &amp; handmade</text>
  <!-- tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#f4ecf7" opacity="0.78">A little arcade. Made by hand. Play in a browser.</text>
  <!-- separator -->
  <line x1="540" y1="450" x2="660" y2="450" stroke="#f4ecf7" stroke-opacity="0.25"/>
  <!-- game tags row -->
  <g font-family="Helvetica,sans-serif" font-size="16" letter-spacing="6" fill="#f4ecf7" opacity="0.65">
    <text x="600" y="510" text-anchor="middle">SONAR · STEALTH · HUNTING · NARRATIVE · ZOMBIES</text>
  </g>
  <!-- url -->
  <text x="600" y="570" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" letter-spacing="4" fill="#ff5fa2">omenly.vercel.app</text>
</svg>
