<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="60%" stop-color="#0d1228"/>
      <stop offset="100%" stop-color="#1a0e22"/>
    </linearGradient>
    <radialGradient id="porch" cx="0.5" cy="0.65" r="0.4">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ff6b35" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffe7a0"/>
      <stop offset="70%" stop-color="#d4b56b"/>
      <stop offset="100%" stop-color="#8a7240"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe7a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffe7a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pumpkin-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb05c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffe7a0" opacity="0.8">
    <circle cx="40" cy="30" r="0.8"/>
    <circle cx="78" cy="55" r="1"/>
    <circle cx="120" cy="22" r="0.6"/>
    <circle cx="165" cy="48" r="0.8"/>
    <circle cx="200" cy="18" r="0.6"/>
    <circle cx="245" cy="40" r="0.7"/>
    <circle cx="320" cy="32" r="0.9"/>
    <circle cx="355" cy="58" r="0.6"/>
    <circle cx="380" cy="22" r="0.7"/>
    <circle cx="20" cy="80" r="0.5"/>
    <circle cx="55" cy="100" r="0.6"/>
    <circle cx="135" cy="78" r="0.5"/>
    <circle cx="180" cy="95" r="0.7"/>
    <circle cx="225" cy="72" r="0.5"/>
    <circle cx="285" cy="85" r="0.8"/>
    <circle cx="345" cy="105" r="0.6"/>
  </g>

  <!-- moon -->
  <circle cx="320" cy="65" r="38" fill="url(#moonglow)"/>
  <circle cx="320" cy="65" r="22" fill="url(#moon)"/>
  <circle cx="312" cy="58" r="2.5" fill="#8a7240" opacity="0.5"/>
  <circle cx="326" cy="72" r="1.8" fill="#8a7240" opacity="0.4"/>
  <circle cx="316" cy="74" r="1.4" fill="#8a7240" opacity="0.4"/>

  <!-- distant tree silhouettes -->
  <path d="M 0 220 L 30 195 L 55 215 L 80 188 L 110 210 L 135 195 L 165 215 L 0 220 Z" fill="#050817" opacity="0.8"/>
  <path d="M 240 215 L 270 195 L 295 210 L 320 188 L 350 205 L 380 195 L 400 215 L 400 230 L 240 230 Z" fill="#050817" opacity="0.8"/>

  <!-- house silhouette (peaked roof) -->
  <g>
    <!-- house body -->
    <rect x="120" y="155" width="160" height="95" fill="#0a0e1f" stroke="#1a1f3a" stroke-width="1"/>
    <!-- roof -->
    <polygon points="110,160 200,108 290,160" fill="#0a0e1f" stroke="#1a1f3a" stroke-width="1"/>
    <!-- chimney -->
    <rect x="245" y="118" width="14" height="32" fill="#0a0e1f" stroke="#1a1f3a" stroke-width="1"/>
    <!-- left window (dark) -->
    <rect x="138" y="178" width="26" height="30" fill="#1a1228" stroke="#2a1a35" stroke-width="0.6"/>
    <line x1="151" y1="178" x2="151" y2="208" stroke="#2a1a35" stroke-width="0.6"/>
    <line x1="138" y1="193" x2="164" y2="193" stroke="#2a1a35" stroke-width="0.6"/>
    <!-- right window (warm — someone's home) -->
    <rect x="236" y="178" width="26" height="30" fill="#ffb05c" opacity="0.4"/>
    <rect x="236" y="178" width="26" height="30" fill="none" stroke="#3a2a1a" stroke-width="0.6"/>
    <line x1="249" y1="178" x2="249" y2="208" stroke="#3a2a1a" stroke-width="0.6"/>
    <line x1="236" y1="193" x2="262" y2="193" stroke="#3a2a1a" stroke-width="0.6"/>
    <!-- door -->
    <rect x="186" y="200" width="28" height="50" fill="#1a0e0a"/>
    <circle cx="207" cy="225" r="1.2" fill="#ffb05c"/>
  </g>

  <!-- porch overhang -->
  <rect x="170" y="195" width="60" height="4" fill="#050817"/>
  <line x1="174" y1="199" x2="174" y2="250" stroke="#1a1f3a" stroke-width="1.5"/>
  <line x1="226" y1="199" x2="226" y2="250" stroke="#1a1f3a" stroke-width="1.5"/>

  <!-- porch glow halo -->
  <ellipse cx="200" cy="240" rx="120" ry="60" fill="url(#porch)"/>

  <!-- pumpkin on porch -->
  <g transform="translate(155, 230)">
    <ellipse cx="0" cy="6" rx="14" ry="3" fill="#050817" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="13" ry="11" fill="#ff6b35"/>
    <path d="M -8 -2 L -4 -6 L 0 -2 L 4 -6 L 8 -2 L 4 4 L 0 1 L -4 4 Z" fill="#1a0e0a"/>
    <rect x="-1" y="-13" width="2" height="3" fill="#3a2a1a"/>
    <ellipse cx="0" cy="0" rx="13" ry="11" fill="url(#pumpkin-glow)" opacity="0.6"/>
  </g>

  <!-- pumpkin on porch right side -->
  <g transform="translate(245, 233)">
    <ellipse cx="0" cy="5" rx="10" ry="2.5" fill="#050817" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="9" ry="8" fill="#ff6b35"/>
    <path d="M -5 -1 L -2.5 -4 L 0 -1 L 2.5 -4 L 5 -1 L 2.5 3 L 0 1 L -2.5 3 Z" fill="#1a0e0a"/>
    <rect x="-0.8" y="-10" width="1.5" height="2" fill="#3a2a1a"/>
  </g>

  <!-- foreground leaves -->
  <g fill="#ff8c42" opacity="0.6">
    <ellipse cx="35" cy="278" rx="4" ry="2" transform="rotate(20 35 278)"/>
    <ellipse cx="68" cy="285" rx="3" ry="1.6" transform="rotate(-15 68 285)"/>
    <ellipse cx="110" cy="280" rx="3.5" ry="1.8" transform="rotate(30 110 280)"/>
    <ellipse cx="310" cy="282" rx="4" ry="2" transform="rotate(-25 310 282)"/>
    <ellipse cx="350" cy="277" rx="3" ry="1.5" transform="rotate(10 350 277)"/>
    <ellipse cx="375" cy="288" rx="3.5" ry="1.7" transform="rotate(-35 375 288)"/>
  </g>

  <!-- title -->
  <text x="200" y="50" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#ffe7a0" text-anchor="middle" letter-spacing="2" opacity="0.95">Porch<tspan fill="#ff8c42">light</tspan></text>
  <text x="200" y="68" font-family="Helvetica, sans-serif" font-size="8" fill="#ffb05c" text-anchor="middle" letter-spacing="4" opacity="0.7">— ONE HALLOWEEN. SIX DOORS —</text>
</svg>
