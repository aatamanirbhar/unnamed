<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#ffd089" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#3a1a4a"/>
      <stop offset="100%" stop-color="#06030a"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1238"/>
      <stop offset="55%" stop-color="#100618"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <linearGradient id="redFigure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#7a1530"/>
    </linearGradient>
    <linearGradient id="blueFigure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fffd4"/>
      <stop offset="100%" stop-color="#1a5a4a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <rect y="240" width="600" height="160" fill="url(#ground)"/>
  <!-- arena ring outline -->
  <ellipse cx="300" cy="280" rx="260" ry="38" fill="none" stroke="#ffd089" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="300" cy="280" rx="220" ry="30" fill="none" stroke="#ff7a2e" stroke-opacity="0.25" stroke-width="1"/>
  <!-- two silhouette fighters facing off -->
  <g fill="url(#redFigure)" opacity="0.95">
    <rect x="160" y="180" width="40" height="80" rx="6"/>
    <circle cx="180" cy="160" r="22"/>
    <rect x="140" y="190" width="20" height="55" rx="5"/>
    <rect x="200" y="190" width="20" height="55" rx="5"/>
    <rect x="158" y="255" width="18" height="50" rx="4"/>
    <rect x="184" y="255" width="18" height="50" rx="4"/>
  </g>
  <g fill="url(#blueFigure)" opacity="0.95">
    <rect x="400" y="180" width="40" height="80" rx="6"/>
    <circle cx="420" cy="160" r="22"/>
    <rect x="380" y="190" width="20" height="55" rx="5"/>
    <rect x="440" y="190" width="20" height="55" rx="5"/>
    <rect x="398" y="255" width="18" height="50" rx="4"/>
    <rect x="424" y="255" width="18" height="50" rx="4"/>
  </g>
  <!-- spark between -->
  <g fill="#ffd089" opacity="0.85">
    <circle cx="300" cy="210" r="6"/>
    <polygon points="300,180 305,210 300,240 295,210"/>
    <polygon points="270,210 300,205 330,210 300,215"/>
  </g>
  <!-- title -->
  <text x="300" y="62" font-family="Georgia,serif" font-style="italic" font-size="62" letter-spacing="6" fill="#ffd089" text-anchor="middle" filter="url(#none)">CLASH</text>
  <text x="300" y="92" font-family="Helvetica,sans-serif" font-size="11" letter-spacing="8" fill="#ff7a2e" text-anchor="middle">SEVEN FIGHTERS · ONE RING</text>
</svg>
