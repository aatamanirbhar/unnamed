<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0410">
<title>omenly</title>
<link rel="stylesheet" href="omenly.css">
<script>
  window.OMENLY_CONFIG = {
    game: 'omenly',
    gameTitle: 'Omenly',
    price: 10,
    allAccessPrice: 10,
    isHub: true,
    donateUrl: 'https://www.paypal.me/vikas117/10',
    allAccessDonateUrl: 'https://www.paypal.me/vikas117/10',
    theme: { accent: '#ff5fa2' }
    // After AdSense approval, add:
    // , adsense: { client: 'ca-pub-XXXXXXXXXXXXXXXX', slot: 'XXXXXXXXXX' }
  };
</script>
<script src="omenly.js" defer></script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root {
    --ink: #f4ecf7;
    --dim: rgba(244,236,247,0.55);
    --line: rgba(244,236,247,0.12);
    --accent: #ff5fa2;
    --warm: #ffd166;
    --bg-a: #0a0410;
    --bg-b: #1a0826;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; background: var(--bg-a); color: var(--ink); font-family: 'Georgia', 'Times New Roman', serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  body { padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: center; position: relative; overflow-x: hidden; }
  #bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 20% 10%, rgba(255,95,162,0.16), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(127,255,212,0.10), transparent 60%), linear-gradient(160deg, #0a0410, #1a0826 60%, #0a0410); pointer-events: none; }
  #grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.06; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); mix-blend-mode: overlay; }
  #bokeh { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .bk { position: absolute; border-radius: 50%; filter: blur(1px); opacity: 0.4; animation: drift linear infinite; }
  @keyframes drift { 0% { transform: translateY(110vh) translateX(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.4; } 100% { transform: translateY(-10vh) translateX(40px); opacity: 0; } }

  header { position: relative; z-index: 2; text-align: center; max-width: 760px; width: 100%; padding: 40px 0 28px; }
  .crown { font-size: 11px; letter-spacing: 6px; opacity: 0.6; text-transform: uppercase; font-family: 'Helvetica', sans-serif; margin-bottom: 18px; color: var(--warm); }
  h1 { font-style: italic; font-weight: normal; font-size: clamp(40px, 8vw, 76px); letter-spacing: 1px; line-height: 1.05; text-shadow: 0 4px 30px rgba(255,95,162,0.35); }
  h1 .amp { color: var(--accent); }
  .tagline { margin: 20px auto 0; max-width: 540px; font-style: italic; opacity: 0.75; font-size: clamp(15px, 2vw, 17px); line-height: 1.5; }
  .sep { width: 60px; height: 1px; background: var(--line); margin: 36px auto 8px; }
  .meta { font-size: 11px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; font-family: 'Helvetica', sans-serif; }

  main { position: relative; z-index: 2; max-width: 1080px; width: 100%; margin-top: 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }

  .tile { position: relative; display: flex; flex-direction: column; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; text-decoration: none; color: inherit; transition: transform 0.3s cubic-bezier(.2,.7,.2,1), border-color 0.3s, box-shadow 0.3s; cursor: pointer; min-height: 380px; }
  .tile::before { content: ''; position: absolute; inset: 0; background: var(--tile-bg, linear-gradient(135deg, #1a0826, #2b0a3d)); opacity: 0.4; transition: opacity 0.4s; z-index: 0; }
  .tile::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 0%, var(--tile-accent, var(--accent)), transparent 60%); opacity: 0; transition: opacity 0.4s; z-index: 0; mix-blend-mode: screen; }
  .tile:hover, .tile:focus-visible { transform: translateY(-6px); border-color: var(--tile-accent, var(--accent)); box-shadow: 0 18px 60px rgba(0,0,0,0.45), 0 0 30px color-mix(in srgb, var(--tile-accent, var(--accent)) 30%, transparent); outline: none; }
  .tile:hover::after, .tile:focus-visible::after { opacity: 0.25; }
  .tile:active { transform: translateY(-2px) scale(0.995); }

  .cover { position: relative; z-index: 1; width: 100%; aspect-ratio: 4/3; background: #0a0410; overflow: hidden; border-bottom: 1px solid var(--line); }
  .cover img, .cover object, .cover svg { display: block; width: 100%; height: 100%; object-fit: cover; }
  .cover .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Helvetica', sans-serif; font-size: 28px; font-weight: bold; letter-spacing: 6px; color: var(--tile-accent, var(--accent)); background: var(--tile-bg, linear-gradient(135deg, #1a0826, #2b0a3d)); text-shadow: 0 0 20px currentColor; }
  .body { position: relative; z-index: 1; padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { font-style: italic; font-size: 22px; line-height: 1.2; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 9px; letter-spacing: 3px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 2px; text-transform: uppercase; font-family: 'Helvetica', sans-serif; opacity: 0.7; color: var(--tile-accent, var(--accent)); border-color: color-mix(in srgb, var(--tile-accent, var(--accent)) 40%, transparent); }
  .blurb { font-size: 14px; line-height: 1.55; opacity: 0.8; font-style: italic; flex: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-family: 'Helvetica', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }
  .play { color: var(--tile-accent, var(--accent)); letter-spacing: 4px; font-weight: 600; }
  .play::after { content: ' →'; transition: transform 0.3s; display: inline-block; }
  .tile:hover .play::after, .tile:focus-visible .play::after { transform: translateX(4px); }

  .empty { padding: 60px; text-align: center; color: var(--dim); font-style: italic; }

  footer { position: relative; z-index: 2; margin-top: 60px; padding: 30px 0; text-align: center; font-size: 12px; letter-spacing: 2px; opacity: 0.5; font-family: 'Helvetica', sans-serif; max-width: 600px; line-height: 1.7; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  #donate { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right)); z-index: 30; }
  #donate a { display: inline-block; padding: 10px 18px; background: rgba(255,95,162,0.08); border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-family: 'Helvetica', sans-serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; transition: all 0.25s; backdrop-filter: blur(6px); }
  #donate a:hover, #donate a:focus-visible { background: var(--accent); color: #fff; box-shadow: 0 0 30px var(--accent); outline: none; }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; gap: 18px; }
    .tile { min-height: 0; }
    .body { padding: 18px 18px 20px; }
    .title { font-size: 19px; }
    .blurb { font-size: 13px; }
    header { padding: 20px 0 20px; }
    .sep { margin: 24px auto 6px; }
    main { margin-top: 24px; }
    #donate a { padding: 8px 14px; font-size: 10px; }
  }
  @media (hover: none) {
    .tile:hover { transform: none; box-shadow: none; border-color: var(--line); }
    .tile:hover::after { opacity: 0; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="grain"></div>
<div id="bokeh"></div>

<header>
  <div class="crown" id="crown">— OMENLY —</div>
  <h1 id="hero">small <span class="amp">&amp;</span> handmade</h1>
  <p class="tagline" id="tagline">A little arcade. Made by hand. Play in a browser.</p>
  <div class="sep"></div>
  <div class="meta" id="count">— LOADING —</div>
</header>

<main>
  <div class="grid" id="grid">
    <div class="empty">Loading the arcade…</div>
  </div>
  <div data-omenly-ad style="margin-top: 40px;"></div>
</main>

<footer>
  Made with care. <a href="https://www.paypal.me/vikas117" target="_blank" rel="noopener">Tip the dev</a> if something here stays with you.
  <br>
  <a href="/about.html">about</a> · <a href="/privacy.html">privacy</a>
</footer>

<div id="donate"><a href="https://www.paypal.me/vikas117/10" target="_blank" rel="noopener" data-omenly-cta>SUPPORT</a></div>

<script>
(() => {
  // ── drifting bokeh ──
  (function bokeh() {
    const box = document.getElementById('bokeh');
    const colors = ['rgba(255,95,162,0.4)', 'rgba(255,209,102,0.35)', 'rgba(127,255,212,0.35)', 'rgba(179,157,219,0.35)'];
    for (let i = 0; i < 24; i++) {
      const b = document.createElement('div');
      b.className = 'bk';
      const size = 3 + Math.random() * 7;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (Math.random() * 100) + '%';
      b.style.background = colors[Math.floor(Math.random() * colors.length)];
      b.style.animationDuration = (16 + Math.random() * 24) + 's';
      b.style.animationDelay = (-Math.random() * 30) + 's';
      box.appendChild(b);
    }
  })();

  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const heroEl = document.getElementById('hero');
  const tagEl = document.getElementById('tagline');
  const crownEl = document.getElementById('crown');

  // Load the manifest. Cache-bust during dev.
  fetch('games.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('No games.json'); return r.json(); })
    .then(render)
    .catch(err => {
      grid.innerHTML = `<div class="empty">Could not load games.json. <br>${String(err)}</div>`;
      countEl.textContent = '— OFFLINE —';
    });

  function render(data) {
    if (data.title) crownEl.textContent = '— ' + data.title + ' —';
    if (data.tagline) tagEl.textContent = data.tagline;
    const games = Array.isArray(data.games) ? data.games : [];
    countEl.textContent = `— ${games.length} GAME${games.length === 1 ? '' : 'S'} —`;
    if (!games.length) {
      grid.innerHTML = `<div class="empty">No games yet. Add one to games.json.</div>`;
      return;
    }
    grid.innerHTML = '';
    games.forEach((g, i) => grid.appendChild(makeTile(g, i)));
    if (window.Omenly && Omenly.decorateAll) Omenly.decorateAll();
  }

  function makeTile(g, i) {
    const tile = document.createElement('a');
    tile.className = 'tile';
    tile.href = g.href || (g.id ? g.id + '/' : '#');
    tile.setAttribute('data-omenly-tile', '');
    if (g.id) tile.setAttribute('data-omenly-game', g.id);
    tile.style.setProperty('--tile-accent', g.accent || '#ff5fa2');
    if (g.background) tile.style.setProperty('--tile-bg', g.background);
    tile.setAttribute('aria-label', `Play ${g.title || g.id}`);
    tile.style.animation = `tilein 0.5s ease ${i * 80}ms both`;

    const cover = document.createElement('div');
    cover.className = 'cover';
    if (g.cover) {
      // Use <img> — works for svg/png/jpg the same.
      const img = document.createElement('img');
      img.src = g.cover;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = () => { cover.innerHTML = ''; cover.appendChild(placeholder(g)); };
      cover.appendChild(img);
    } else {
      cover.appendChild(placeholder(g));
    }

    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `
      <div class="tags">${(g.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join('')}</div>
      <div class="title">${escape(g.title || g.id || 'Untitled')}</div>
      <div class="blurb">${escape(g.blurb || '')}</div>
      <div class="row">
        <span>${g.minutes ? `~${g.minutes} min` : (g.controls || '')}</span>
        <span class="play">PLAY</span>
      </div>
    `;
    tile.append(cover, body);
    return tile;
  }

  function placeholder(g) {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = (g.title || g.id || '?').slice(0, 2).toUpperCase();
    return ph;
  }

  function escape(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // tile fade-in keyframes (injected so we don't pollute the stylesheet section)
  const sheet = document.createElement('style');
  sheet.textContent = `@keyframes tilein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }`;
  document.head.appendChild(sheet);
})();
</script>
</body>
</html>
