<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#3a0e1a"/>
      <stop offset="40%" stop-color="#1a0810"/>
      <stop offset="100%" stop-color="#06030a"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0510"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff5d9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd089"/>
      <stop offset="100%" stop-color="#fff5d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- horizon corridor -->
  <polygon points="0,400 300,240 600,400" fill="url(#floor)"/>
  <!-- vanishing point glow -->
  <circle cx="300" cy="240" r="120" fill="#ff4d2e" opacity="0.18" filter="url(#glow)"/>
  <!-- perspective lines -->
  <g stroke="#ff7a2e" stroke-width="1.2" opacity="0.35">
    <line x1="0" y1="400" x2="300" y2="240"/>
    <line x1="120" y1="400" x2="300" y2="240"/>
    <line x1="240" y1="400" x2="300" y2="240"/>
    <line x1="360" y1="400" x2="300" y2="240"/>
    <line x1="480" y1="400" x2="300" y2="240"/>
    <line x1="600" y1="400" x2="300" y2="240"/>
  </g>
  <!-- approaching enemies (silhouettes) -->
  <g fill="#1a0a14">
    <ellipse cx="220" cy="300" rx="18" ry="22"/>
    <ellipse cx="380" cy="310" rx="22" ry="28"/>
    <ellipse cx="310" cy="270" rx="10" ry="14"/>
    <ellipse cx="270" cy="260" rx="6" ry="9"/>
    <ellipse cx="340" cy="258" rx="7" ry="10"/>
  </g>
  <!-- blade slash, foreground -->
  <g transform="translate(300 360) rotate(-25)" filter="url(#glow)">
    <rect x="-180" y="-6" width="360" height="12" fill="url(#blade)" rx="6"/>
  </g>
  <g transform="translate(300 360) rotate(-25)">
    <rect x="-160" y="-2" width="320" height="4" fill="#fff5d9" rx="2"/>
  </g>
  <!-- title -->
  <g font-family="Georgia, serif" fill="#fff5d9">
    <text x="300" y="78" text-anchor="middle" font-style="italic" font-size="62" letter-spacing="6" style="text-shadow: 0 0 20px #ff4d2e;">CARVE</text>
    <text x="300" y="108" text-anchor="middle" font-size="11" letter-spacing="6" fill="#ff7a2e" font-family="Helvetica,sans-serif" font-weight="bold">— ONE BLADE · ONE ROAD —</text>
  </g>
</svg>
