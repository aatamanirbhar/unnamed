<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15101e"/>
      <stop offset="55%" stop-color="#2a1820"/>
      <stop offset="100%" stop-color="#3a1a14"/>
    </linearGradient>
    <radialGradient id="peakglow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#ffd089" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff7a2e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd089" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff7a2e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff7a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1820" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9fd9ff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#sky)"/>

  <!-- distant peak with altar glow -->
  <circle cx="200" cy="130" r="90" fill="url(#peakglow)"/>
  <g fill="#0a060d" opacity="0.96">
    <polygon points="60,170 100,90 130,130 160,70 200,40 240,80 280,60 320,120 360,90 400,170 400,300 60,300"/>
  </g>
  <g fill="#1a0e16" opacity="0.8">
    <polygon points="60,200 110,140 140,170 180,110 220,90 260,140 300,120 340,160 400,180 400,300 60,300"/>
  </g>

  <!-- altar on the peak -->
  <g transform="translate(200,68)">
    <rect x="-8" y="-2" width="16" height="6" fill="#0a060d"/>
    <ellipse cx="0" cy="-2" rx="4" ry="1.4" fill="#3a1810"/>
    <circle cx="0" cy="-6" r="9" fill="url(#lantglow)"/>
  </g>

  <!-- stars over the valley -->
  <g fill="#cfe6ff" opacity="0.6">
    <circle cx="40" cy="30" r="0.7"/>
    <circle cx="86" cy="22" r="0.8"/>
    <circle cx="130" cy="44" r="0.5"/>
    <circle cx="270" cy="32" r="0.6"/>
    <circle cx="310" cy="18" r="0.7"/>
    <circle cx="350" cy="36" r="0.5"/>
    <circle cx="380" cy="60" r="0.6"/>
  </g>

  <!-- embers floating up -->
  <g fill="#ff7a2e" opacity="0.85">
    <circle cx="120" cy="180" r="1.4"/>
    <circle cx="260" cy="160" r="1.2"/>
    <circle cx="220" cy="210" r="1.6"/>
    <circle cx="180" cy="240" r="1.4"/>
    <circle cx="300" cy="200" r="1.2"/>
    <circle cx="90" cy="220" r="1.4"/>
  </g>
  <g fill="#ffd089" opacity="0.6">
    <circle cx="150" cy="170" r="0.9"/>
    <circle cx="240" cy="190" r="0.9"/>
    <circle cx="320" cy="180" r="0.9"/>
    <circle cx="100" cy="190" r="0.8"/>
    <circle cx="200" cy="170" r="0.8"/>
  </g>

  <!-- burnt foreground forest -->
  <g stroke="#06030a" stroke-linecap="round" fill="none">
    <g stroke-width="3">
      <line x1="20" y1="290" x2="22" y2="225"/>
      <line x1="60" y1="290" x2="58" y2="215"/>
      <line x1="100" y1="290" x2="102" y2="200"/>
      <line x1="340" y1="290" x2="338" y2="220"/>
      <line x1="375" y1="290" x2="376" y2="210"/>
    </g>
    <g stroke-width="1.4">
      <path d="M22 240 L8 232"/>
      <path d="M22 230 L34 220"/>
      <path d="M58 224 L70 210"/>
      <path d="M58 218 L48 208"/>
      <path d="M102 210 L114 198"/>
      <path d="M102 205 L90 200"/>
      <path d="M338 226 L324 218"/>
      <path d="M338 220 L348 212"/>
      <path d="M376 218 L388 210"/>
    </g>
  </g>

  <!-- mid fog -->
  <rect x="0" y="170" width="400" height="80" fill="url(#fog)" opacity="0.55"/>

  <!-- ground -->
  <rect x="0" y="240" width="400" height="60" fill="#0a050d"/>
  <path d="M 0 240 Q 200 252 400 240 L 400 264 Q 200 272 0 264 Z" fill="#1a0e16" opacity="0.8"/>

  <!-- path -->
  <path d="M 60 300 Q 140 270 200 250 Q 260 232 320 240" fill="none" stroke="#221610" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <path d="M 60 300 Q 140 270 200 250 Q 260 232 320 240" fill="none" stroke="#3a261a" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- scattered ash + leaves -->
  <g opacity="0.85">
    <ellipse cx="40" cy="285" rx="3" ry="1.2" fill="#5a3022" transform="rotate(15 40 285)"/>
    <ellipse cx="84" cy="278" rx="2.4" ry="1" fill="#7a4028" transform="rotate(-22 84 278)"/>
    <ellipse cx="146" cy="270" rx="3" ry="1.2" fill="#5a3022" transform="rotate(30 146 270)"/>
    <ellipse cx="252" cy="262" rx="2.6" ry="1.1" fill="#7a4028" transform="rotate(-15 252 262)"/>
    <ellipse cx="306" cy="252" rx="2.4" ry="1" fill="#5a3022" transform="rotate(20 306 252)"/>
    <ellipse cx="356" cy="248" rx="2.8" ry="1.2" fill="#7a4028" transform="rotate(-30 356 248)"/>
  </g>

  <!-- player silhouette with staff lantern -->
  <g transform="translate(190, 252)">
    <circle cx="6" cy="-2" r="64" fill="url(#lantglow)"/>
    <ellipse cx="-2" cy="22" rx="11" ry="2" fill="#06030a" opacity="0.8"/>
    <!-- cloak -->
    <path d="M -10 22 L -8 -2 L -2 -10 L 4 -10 L 8 -2 L 10 22 Z" fill="#1a0a1a"/>
    <circle cx="-1" cy="-14" r="6" fill="#1a0a1a"/>
    <!-- staff -->
    <line x1="12" y1="18" x2="18" y2="-22" stroke="#1a0a1a" stroke-width="2"/>
    <!-- lantern body on staff -->
    <g transform="translate(18, -22)">
      <rect x="-4" y="-4" width="8" height="9" fill="#3a2818" stroke="#1a1208" stroke-width="0.5"/>
      <rect x="-3" y="-3" width="6" height="7" fill="#ffd089"/>
      <circle cx="0" cy="0" r="2" fill="#fff5d9"/>
    </g>
  </g>

  <!-- distant memory stone glow -->
  <g transform="translate(320, 230)">
    <ellipse cx="0" cy="14" rx="9" ry="2" fill="#06030a" opacity="0.6"/>
    <path d="M -6 12 L -7 0 L -4 -10 L 4 -10 L 7 -2 L 6 12 Z" fill="#1a2244"/>
    <circle cx="0" cy="-2" r="10" fill="#9fd9ff" opacity="0.3"/>
    <circle cx="0" cy="-2" r="1.5" fill="#cfe6ff" opacity="0.9"/>
  </g>

  <!-- soft mist front -->
  <rect x="0" y="220" width="400" height="80" fill="url(#fog)" opacity="0.3"/>

  <!-- title -->
  <text x="200" y="46" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#ffe7a0" text-anchor="middle" letter-spacing="2" opacity="0.95">Ashen<tspan fill="#ff7a2e">reach</tspan></text>
  <text x="200" y="62" font-family="Helvetica, sans-serif" font-size="8" fill="#9fd9ff" text-anchor="middle" letter-spacing="4" opacity="0.7">— THE LAST CARTOGRAPHER —</text>
</svg>
