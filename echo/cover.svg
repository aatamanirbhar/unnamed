<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="dark" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#021018"/>
      <stop offset="60%" stop-color="#000507"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="ping" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fffd4" stop-opacity="0"/>
      <stop offset="80%" stop-color="#7fffd4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#dark)"/>

  <!-- expanding ping rings -->
  <g fill="none" stroke="#7fffd4" stroke-width="1.5">
    <circle cx="300" cy="210" r="60" opacity="0.85"/>
    <circle cx="300" cy="210" r="120" opacity="0.45"/>
    <circle cx="300" cy="210" r="180" opacity="0.18"/>
  </g>
  <circle cx="300" cy="210" r="220" fill="url(#ping)"/>

  <!-- faint room outlines revealed by ping -->
  <g stroke="#7fffd4" stroke-width="1" fill="none" opacity="0.5">
    <rect x="160" y="120" width="80" height="60"/>
    <rect x="360" y="120" width="100" height="80"/>
    <rect x="200" y="240" width="120" height="60"/>
    <rect x="380" y="240" width="60" height="50"/>
    <line x1="240" y1="180" x2="280" y2="180"/>
    <line x1="320" y1="260" x2="380" y2="260"/>
  </g>

  <!-- enemy silhouettes (very faint) -->
  <g fill="#7fffd4" opacity="0.7">
    <circle cx="200" cy="150" r="5"/>
    <circle cx="400" cy="160" r="6"/>
    <circle cx="240" cy="270" r="5"/>
  </g>
  <!-- red glow on one — the tank -->
  <g>
    <circle cx="430" cy="280" r="8" fill="#ff3a3a" filter="url(#glow)"/>
    <circle cx="430" cy="280" r="5" fill="#ff3a3a"/>
  </g>

  <!-- player at center -->
  <circle cx="300" cy="210" r="14" fill="#7fffd4" opacity="0.18"/>
  <circle cx="300" cy="210" r="7" fill="#7fffd4" filter="url(#glow)"/>
  <circle cx="300" cy="210" r="3" fill="#fff"/>

  <!-- battery bar (visual flavor) -->
  <g>
    <rect x="40" y="360" width="120" height="10" fill="none" stroke="#7fffd4" stroke-width="1" opacity="0.6"/>
    <rect x="42" y="362" width="78" height="6" fill="#7fffd4" opacity="0.85"/>
    <text x="40" y="352" font-family="Courier New, monospace" font-size="9" fill="#7fffd4" letter-spacing="3" opacity="0.7">BATTERY</text>
  </g>

  <!-- title -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="300" y="62" font-size="52" font-style="italic" letter-spacing="14" fill="#7fffd4" filter="url(#glow)">ECHO</text>
    <text x="300" y="62" font-size="52" font-style="italic" letter-spacing="14" fill="#e8fff8">ECHO</text>
    <text x="300" y="380" font-size="10" letter-spacing="6" fill="#7fffd4" opacity="0.7">— PING. RUN. SURVIVE. —</text>
  </g>
</svg>
