<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" width="630" height="500">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="ping" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#7fffd4" stop-opacity="0"/>
      <stop offset="98%" stop-color="#7fffd4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ping2" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#7fffd4" stop-opacity="0"/>
      <stop offset="98%" stop-color="#7fffd4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="player" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0fff6"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="enemy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8094"/>
      <stop offset="60%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Pure black backdrop -->
  <rect width="630" height="500" fill="#000"/>

  <!-- Illuminated walls/maze fragments revealed by ping -->
  <g opacity="0.55">
    <rect x="60" y="60" width="48" height="48" fill="#7fffd4" opacity="0.18"/>
    <rect x="60" y="60" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.7"/>
    <rect x="108" y="60" width="48" height="48" fill="#7fffd4" opacity="0.15"/>
    <rect x="108" y="60" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.55"/>

    <rect x="500" y="120" width="48" height="48" fill="#7fffd4" opacity="0.2"/>
    <rect x="500" y="120" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.75"/>
    <rect x="500" y="168" width="48" height="48" fill="#7fffd4" opacity="0.15"/>
    <rect x="500" y="168" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.55"/>

    <rect x="80" y="380" width="48" height="48" fill="#7fffd4" opacity="0.16"/>
    <rect x="80" y="380" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.6"/>
    <rect x="128" y="380" width="48" height="48" fill="#7fffd4" opacity="0.14"/>
    <rect x="128" y="380" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.5"/>

    <rect x="480" y="380" width="48" height="48" fill="#7fffd4" opacity="0.18"/>
    <rect x="480" y="380" width="48" height="48" fill="none" stroke="#b4ffe5" stroke-width="1" opacity="0.65"/>
  </g>

  <!-- Outer fading ping ring -->
  <circle cx="315" cy="280" r="240" fill="url(#ping2)"/>
  <circle cx="315" cy="280" r="240" fill="none" stroke="#7fffd4" stroke-width="1" opacity="0.4"/>

  <!-- Main bright ping ring -->
  <circle cx="315" cy="280" r="170" fill="url(#ping)"/>
  <circle cx="315" cy="280" r="170" fill="none" stroke="#b4ffe5" stroke-width="2" opacity="0.85" filter="url(#glow)"/>

  <!-- Enemy at edge of ping -->
  <g filter="url(#glow)">
    <circle cx="470" cy="200" r="18" fill="url(#enemy)" opacity="0.95"/>
    <polygon points="470,182 478,200 470,218 462,200" fill="#ffb4c0" opacity="0.7"/>
  </g>

  <!-- Player center -->
  <circle cx="315" cy="280" r="22" fill="url(#player)" filter="url(#glow)"/>
  <circle cx="315" cy="280" r="7" fill="#ffffff"/>
  <circle cx="315" cy="280" r="13" fill="none" stroke="#7fffd4" stroke-width="1" opacity="0.6"/>

  <!-- Vignette darken edges -->
  <rect width="630" height="500" fill="url(#vignette)"/>

  <!-- Big bold title -->
  <g filter="url(#glow)">
    <text x="315" y="98" font-family="'Courier New', monospace" font-size="78" font-weight="900" letter-spacing="14" text-anchor="middle" fill="#7fffd4">ECHO</text>
  </g>
  <text x="315" y="98" font-family="'Courier New', monospace" font-size="78" font-weight="900" letter-spacing="14" text-anchor="middle" fill="#e0fff6" opacity="0.95">ECHO</text>

  <!-- Hook line (clickbait) -->
  <text x="315" y="445" font-family="'Courier New', monospace" font-size="22" font-weight="bold" letter-spacing="5" text-anchor="middle" fill="#ffffff">WHAT MOVES IN THE DARK?</text>
  <text x="315" y="475" font-family="'Courier New', monospace" font-size="12" letter-spacing="6" text-anchor="middle" fill="#7fffd4" opacity="0.85">— A SONAR SURVIVAL GAME —</text>
</svg>
