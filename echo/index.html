  #gameover button { background: transparent; border: 1px solid #7fffd4; color: #7fffd4; padding: 12px 24px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 4px; cursor: pointer; transition: all 0.2s; }
  #gameover button:hover { background: #7fffd4; color: #000; box-shadow: 0 0 20px #7fffd4; }

  #controls { position: fixed; bottom: 16px; left: 16px; font-size: 11px; letter-spacing: 2px; opacity: 0.5; z-index: 10; pointer-events: none; }
  #controls div { margin-bottom: 2px; }
  #donate { position: fixed; bottom: 16px; right: 16px; z-index: 30; }
  #donate a { display: inline-block; padding: 9px 16px; background: transparent; border: 1px solid #7fffd4; color: #7fffd4; text-decoration: none; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 3px; transition: all 0.2s; text-shadow: 0 0 8px #7fffd4; }

  /* Mobile / touch controls */
  #touch-controls { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none; }
  #touch-controls.on { display: block; }
  #stick { position: absolute; bottom: max(70px, env(safe-area-inset-bottom, 0px) + 60px); left: max(30px, env(safe-area-inset-left, 0px) + 20px); width: 140px; height: 140px; border-radius: 50%; background: rgba(127,255,212,0.06); border: 2px solid rgba(127,255,212,0.35); box-shadow: 0 0 24px rgba(127,255,212,0.18); pointer-events: auto; touch-action: none; }
  #stick::after { content: 'MOVE'; position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 4px; color: #7fffd4; opacity: 0.6; text-shadow: 0 0 6px #7fffd4; }

  #ping-btn:active, #ping-btn.cool { background: rgba(127,255,212,0.18); transform: scale(0.96); }
  #ping-btn:disabled { opacity: 0.35; }
  #ping-btn::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(127,255,212,0.4); animation: ringp 1.6s ease-out infinite; pointer-events: none; }
  @keyframes ringp { 0% { transform: scale(0.92); opacity: 0.7; } 100% { transform: scale(1.18); opacity: 0; } }
  @media (max-width: 480px) {

    #stick .knob { width: 52px; height: 52px; margin: -26px 0 0 -26px; }

  @media (max-height: 500px) and (orientation: landscape) {

<body>
<canvas id="game"></canvas>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const depthEl = document.getElementById('depth');
  const depthNum = document.getElementById('depth-num');
  const titleEl = document.getElementById('title');
  const gameoverEl = document.getElementById('gameover');
  const goDepth = document.getElementById('go-depth');
  const goTitle = document.getElementById('go-title');
  const restartBtn = document.getElementById('restart');
  const cooldownBar = document.getElementById('cooldown-bar');
  const touchControls = document.getElementById('touch-controls');
  const stickEl = document.getElementById('stick');
  const knob = stickEl.querySelector('.knob');
  const pingBtn = document.getElementById('ping-btn');
  const controlsEl = document.getElementById('controls');

  // ── viewport ──
  let W = 0, H = 0;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ── audio ──
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, attack = 0.005) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const SFX = {
    ping:  () => { tone(440, 0.4, 'sine', 0.12); tone(660, 0.5, 'sine', 0.06); },
    hurt:  () => { tone(120, 0.3, 'sawtooth', 0.18); tone(80, 0.5, 'sawtooth', 0.12); },
    exit:  () => { tone(660, 0.15, 'sine', 0.15); setTimeout(() => tone(880, 0.3, 'sine', 0.15), 120); },
    death: () => {
      tone(220, 0.4, 'sawtooth', 0.2);
      setTimeout(() => tone(110, 0.6, 'sawtooth', 0.2), 200);
      setTimeout(() => tone(55,  1.0, 'sawtooth', 0.2), 500);
    }
  };

  // ── maze ──
  const CELL = 48;
  let grid = [], gw = 0, gh = 0;
  function genMaze(w, h) {
    gw = w; gh = h;
    grid = Array.from({ length: h }, () => new Array(w).fill(1));
    // iterative DFS so big mazes can't overflow the stack
    const stack = [[1, 1]];
    grid[1][1] = 0;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const dirs = [[0,-2],[2,0],[0,2],[-2,0]];
      // shuffle
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
      }
      let moved = false;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && ny > 0 && nx < w - 1 && ny < h - 1 && grid[ny][nx] === 1) {
          grid[y + dy / 2][x + dx / 2] = 0;
          grid[ny][nx] = 0;
          stack.push([nx, ny]);
          moved = true;
          break;
        }
      }
      if (!moved) stack.pop();
    }
    // knock out random walls to break up corridors
    const knock = (w * h) / 14;
    for (let i = 0; i < knock; i++) {
      const rx = 1 + ((Math.random() * (w - 2)) | 0);
      const ry = 1 + ((Math.random() * (h - 2)) | 0);
      grid[ry][rx] = 0;
    }
  }

  // ── state ──
  let player = null;
  let exitGate = null;
  let enemies = [];
  let pings = [];
  let cells = new Map();
  let depth = 1;
  let alive = false;
  let started = false;
  const keys = Object.create(null);
  let lastPingTime = 0;
  const PING_COOLDOWN = 800;

  const stickVec = { x: 0, y: 0 };
  let stickPointerId = null;

  // ── touch detection ──
  const isTouch =
    ('ontouchstart' in window) ||
    (navigator.maxTouchPoints > 0) ||
    matchMedia('(pointer: coarse)').matches;
  if (isTouch) {
    touchControls.classList.add('on');
    controlsEl.style.display = 'none';
  }

  function newLevel(d) {
    depth = d;
    depthNum.textContent = d;
    const size = Math.min(15 + d * 2, 35);
    const w = size | 1, h = size | 1;
    genMaze(w, h);
    player = { x: 1.5 * CELL, y: 1.5 * CELL, r: 7 };
    // exit = farthest open cell from start
    let best = { x: w - 2, y: h - 2, d: 0 };
    for (let y = 1; y < h; y++) {
      for (let x = 1; x < w; x++) {
        if (grid[y][x] === 0) {
          const dd = (x - 1) * (x - 1) + (y - 1) * (y - 1);
          if (dd > best.d) best = { x, y, d: dd };
        }
      }
    }
    exitGate = { x: (best.x + 0.5) * CELL, y: (best.y + 0.5) * CELL, r: 14 };
    enemies = [];
    const enemyCount = Math.min(2 + Math.floor(d * 1.2), 18);
    let attempts = 0;
    while (enemies.length < enemyCount && attempts < enemyCount * 60) {
      attempts++;
      const ex = 1 + ((Math.random() * (w - 2)) | 0);
      const ey = 1 + ((Math.random() * (h - 2)) | 0);
      if (grid[ey][ex] !== 0) continue;
      if (Math.abs(ex - 1) + Math.abs(ey - 1) < 6) continue;
      enemies.push({
        x: (ex + 0.5) * CELL,
        y: (ey + 0.5) * CELL,
        r: 8,
        target: null,
        wakeUntil: 0,
        wanderAngle: Math.random() * Math.PI * 2
      });
    }
    pings = [];
    cells = new Map();
  }

  function start() {
    titleEl.classList.add('hidden');
    gameoverEl.classList.add('hidden');
    hud.classList.remove('hidden');
    depthEl.classList.remove('hidden');
    alive = true;
    started = true;
    for (const k in keys) keys[k] = false;
    stickVec.x = 0; stickVec.y = 0;
    if (stickPointerId !== null) {
      try { stickEl.releasePointerCapture(stickPointerId); } catch (_) {}
      stickPointerId = null;
    }
    knob.style.transform = 'translate(0, 0)';
    lastPingTime = performance.now() - PING_COOLDOWN;
    newLevel(1);
    ensureAudio();
  }

  function die() {
    if (!alive) return;
    alive = false;
    SFX.death();
    goTitle.textContent = 'CONSUMED';
    goDepth.textContent = depth;
    setTimeout(() => { if (!alive) gameoverEl.classList.remove('hidden'); }, 800);
  }

  function ping(px, py) {
    const now = performance.now();
    if (now - lastPingTime < PING_COOLDOWN) return;
    lastPingTime = now;
    pings.push({ x: px, y: py, r: 0, maxR: 600, born: now, intensity: 1 });
    SFX.ping();
    for (const e of enemies) {
      const dx = e.x - px, dy = e.y - py;
      if (Math.hypot(dx, dy) < 500) {
        e.target = { x: px, y: py };
        e.wakeUntil = now + 3500;
      }
    }
  }

  // ── input ──
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (e.repeat) return;
    if (k === ' ') {
      e.preventDefault();
      if (!started) { start(); return; }
      if (!alive) { start(); return; }
      keys[k] = true;
      ping(player.x, player.y);
      return;
    }
    if (k === 'enter') {
      if (!alive && started) { start(); return; }
    }
    if (!started && /^[a-z]$/.test(k)) { start(); return; }
    keys[k] = true;
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  canvas.addEventListener('mousedown', e => {
    if (isTouch) return; // touch devices use joystick + ping button
    ensureAudio();
    if (!started) { start(); return; }
    if (!alive) return;
    ping(player.x, player.y);
  });
  // first touch on the canvas starts/restarts only — joystick + button handle in-game
  canvas.addEventListener('touchstart', e => {
    if (!started || !alive) {
      e.preventDefault();
      ensureAudio();
      start();
    }
  }, { passive: false });
  restartBtn.addEventListener('click', () => { ensureAudio(); start(); });

  // ── virtual joystick ──
  function setStickFromPoint(clientX, clientY) {
    const r = stickEl.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const max = r.width / 2;
    let dx = clientX - cx, dy = clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > max) { dx = (dx / d) * max; dy = (dy / d) * max; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    stickVec.x = dx / max;
    stickVec.y = dy / max;
  }
  function releaseStick() {
    stickVec.x = 0;
    stickVec.y = 0;
    knob.style.transform = 'translate(0, 0)';
    stickPointerId = null;
  }
  stickEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();
    if (!started) { start(); return; }
    if (!alive) return;
    stickPointerId = e.pointerId;
    try { stickEl.setPointerCapture(e.pointerId); } catch (_) {}
    setStickFromPoint(e.clientX, e.clientY);
  });
  stickEl.addEventListener('pointermove', e => {
    if (stickPointerId !== e.pointerId) return;
    e.preventDefault();
    setStickFromPoint(e.clientX, e.clientY);
  });
  const endStick = e => {
    if (stickPointerId !== e.pointerId) return;
    try { stickEl.releasePointerCapture(e.pointerId); } catch (_) {}
    releaseStick();
  };
  stickEl.addEventListener('pointerup', endStick);
  stickEl.addEventListener('pointercancel', endStick);
  stickEl.addEventListener('lostpointercapture', endStick);

  // ── ping button ──
  let pingBtnDebounce = 0;
  function doPingPress(e) {
    e.preventDefault();
    e.stopPropagation();
    const now = performance.now();
    if (now - pingBtnDebounce < 250) return;
    pingBtnDebounce = now;
    ensureAudio();
    if (!started) { start(); return; }
    if (!alive) { start(); return; }
    if (pingBtn.disabled) return;
    ping(player.x, player.y);
  }
  pingBtn.addEventListener('pointerdown', doPingPress);
  pingBtn.addEventListener('touchstart', doPingPress, { passive: false });
  pingBtn.addEventListener('contextmenu', e => e.preventDefault());

  // ── collision ──
  function isWall(x, y) {
    const gx = Math.floor(x / CELL), gy = Math.floor(y / CELL);
    if (gx < 0 || gy < 0 || gx >= gw || gy >= gh) return true;
    return grid[gy][gx] === 1;
  }
  function moveEntity(e, dx, dy) {
    const r = e.r;
    const sx = Math.sign(dx), sy = Math.sign(dy);
    const nx = e.x + dx;
    if (sx !== 0 && !isWall(nx + sx * r, e.y - r * 0.7) && !isWall(nx + sx * r, e.y + r * 0.7)) {
      e.x = nx;
    }
    const ny = e.y + dy;
    if (sy !== 0 && !isWall(e.x - r * 0.7, ny + sy * r) && !isWall(e.x + r * 0.7, ny + sy * r)) {
      e.y = ny;
    }
  }

  // ── cell memory ──
  function ckey(gx, gy) { return gy * 10000 + gx; }
  function rememberCellsAt(wx, wy, intensity) {
    const gx = Math.floor(wx / CELL), gy = Math.floor(wy / CELL);
    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        const cx = gx + ox, cy = gy + oy;
        if (cx < 0 || cy < 0 || cx >= gw || cy >= gh) continue;
        const k = ckey(cx, cy);
        const prev = cells.get(k);
        const add = intensity * 0.7;
        if (prev) {
          if (prev.alpha < 1) prev.alpha = Math.min(1, prev.alpha + add);
        } else {
          cells.set(k, { alpha: Math.min(1, add), gx: cx, gy: cy, wall: grid[cy][cx] === 1 });
        }
      }
    }
  }

  // ── update / render ──
  function update(dt, now) {
    // input → movement
    let ix = 0, iy = 0;
    if (keys['w'] || keys['arrowup'])    iy -= 1;
    if (keys['s'] || keys['arrowdown'])  iy += 1;
    if (keys['a'] || keys['arrowleft'])  ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (stickVec.x || stickVec.y) { ix += stickVec.x; iy += stickVec.y; }
    const len = Math.hypot(ix, iy);
    if (len > 1) { ix /= len; iy /= len; }
    const speed = 140;
    moveEntity(player, ix * speed * dt, iy * speed * dt);
    if (len > 0 && Math.random() < 0.4) rememberCellsAt(player.x, player.y, 0.04);

    // pings expand
    for (let i = pings.length - 1; i >= 0; i--) {
      const p = pings[i];
      const age = (now - p.born) / 1000;
      p.r = age * 380;
      p.intensity = Math.max(0, 1 - age / 1.6);
      const steps = Math.min(128, Math.floor(p.r / 12) + 16);
      const TWO_PI = Math.PI * 2;
      for (let s = 0; s < steps; s++) {
        const a = (s / steps) * TWO_PI;
        rememberCellsAt(p.x + Math.cos(a) * p.r, p.y + Math.sin(a) * p.r, p.intensity * 0.18);
      }
      if (p.r > p.maxR || p.intensity <= 0.01) pings.splice(i, 1);
    }

    // memory fade
    for (const [k, c] of cells) {
      c.alpha -= dt * 0.12;
      if (c.alpha <= 0) cells.delete(k);
    }

    // enemies
    for (const e of enemies) {
      const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
      let tx = null, ty = null;
      if (distToPlayer < 80) {
        tx = player.x; ty = player.y;
        e.wakeUntil = now + 2500;
      } else if (now < e.wakeUntil && e.target) {
        tx = e.target.x; ty = e.target.y;
      }
      if (tx !== null) {
        const dx = tx - e.x, dy = ty - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const espeed = 75 + Math.min(depth * 4, 40);
        moveEntity(e, (dx / d) * espeed * dt, (dy / d) * espeed * dt);
      } else {
        e.wanderAngle += (Math.random() - 0.5) * 0.3;
        const espeed = 22;
        moveEntity(e, Math.cos(e.wanderAngle) * espeed * dt, Math.sin(e.wanderAngle) * espeed * dt);
      }
      if (distToPlayer < player.r + e.r) {
        SFX.hurt();
        die();
        return;
      }
    }

    // exit
    const dex = exitGate.x - player.x, dey = exitGate.y - player.y;
    if (Math.hypot(dex, dey) < exitGate.r + player.r) {
      SFX.exit();
      newLevel(depth + 1);
      return;
    }

    // cooldown bar
    const elapsed = now - lastPingTime;
    const ratio = Math.max(0, Math.min(1, elapsed / PING_COOLDOWN));
    cooldownBar.style.width = (ratio * 100) + '%';
    if (isTouch) {
      const ready = ratio >= 1;
      pingBtn.disabled = !ready;
      pingBtn.classList.toggle('cool', !ready);
    }
  }

  function render(now) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (!started || !player) return;

    const camX = player.x - W / 2;
    const camY = player.y - H / 2;
    ctx.save();
    ctx.translate(-camX, -camY);

    // remembered cells
    for (const [, c] of cells) {
      const x = c.gx * CELL, y = c.gy * CELL;
      if (x + CELL < camX || y + CELL < camY || x > camX + W || y > camY + H) continue;
      if (c.wall) {
        ctx.fillStyle = `rgba(127,255,212,${c.alpha * 0.5})`;
        ctx.fillRect(x, y, CELL, CELL);
        ctx.strokeStyle = `rgba(180,255,230,${c.alpha * 0.9})`;
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
      } else {
        ctx.fillStyle = `rgba(127,255,212,${c.alpha * 0.08})`;
        ctx.fillRect(x, y, CELL, CELL);
      }
    }

    // pings
    for (const p of pings) {
      const grad = ctx.createRadialGradient(p.x, p.y, Math.max(0, p.r - 30), p.x, p.y, p.r + 5);
      grad.addColorStop(0, 'rgba(127,255,212,0)');
      grad.addColorStop(0.85, `rgba(127,255,212,${p.intensity * 0.5})`);
      grad.addColorStop(1, 'rgba(127,255,212,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(180,255,230,${p.intensity * 0.9})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // enemies (visible on wavefront / when very close)
    for (const e of enemies) {
      let visibility = 0;
      for (const p of pings) {
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (Math.abs(d - p.r) < 30) visibility = Math.max(visibility, p.intensity);
      }
      const distP = Math.hypot(e.x - player.x, e.y - player.y);
      if (distP < 60) visibility = Math.max(visibility, (60 - distP) / 60 * 0.8);
      if (visibility <= 0) continue;
      ctx.save();
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 18 * visibility;
      ctx.fillStyle = `rgba(255,77,109,${Math.min(1, visibility * 1.4)})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,180,200,${visibility})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + now * 0.001;
        const rr = e.r * 0.5 + Math.sin(now * 0.005 + i) * 2;
        const xx = e.x + Math.cos(a) * rr;
        const yy = e.y + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    // exit
    let exitVis = 0;
    for (const p of pings) {
      const d = Math.hypot(exitGate.x - p.x, exitGate.y - p.y);
      if (Math.abs(d - p.r) < 40) exitVis = Math.max(exitVis, p.intensity);
    }
    const distExit = Math.hypot(exitGate.x - player.x, exitGate.y - player.y);
    if (distExit < 90) exitVis = Math.max(exitVis, (90 - distExit) / 90 * 0.6);
    if (exitVis > 0) {
      ctx.save();
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 30 * exitVis;
      ctx.strokeStyle = `rgba(255,209,102,${exitVis})`;
      ctx.lineWidth = 2;
      const pulse = 1 + Math.sin(now * 0.005) * 0.15;
      ctx.beginPath();
      ctx.arc(exitGate.x, exitGate.y, exitGate.r * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(exitGate.x, exitGate.y, exitGate.r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,209,102,${exitVis * 0.6})`;
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();

    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // player (screen-space)
    const psx = player.x - camX;
    const psy = player.y - camY;
    const pulse = 1 + Math.sin(now * 0.003) * 0.06;
    const breathR = player.r + 12 + Math.sin(now * 0.003) * 2;
    ctx.fillStyle = 'rgba(0,12,9,0.92)';
    ctx.beginPath();
    ctx.arc(psx, psy, player.r + 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const aura = ctx.createRadialGradient(psx, psy, 0, psx, psy, 42 * pulse);
    aura.addColorStop(0,   'rgba(224,255,246,0.55)');
    aura.addColorStop(0.45,'rgba(127,255,212,0.22)');
    aura.addColorStop(1,   'rgba(127,255,212,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(psx, psy, 42 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,14,10,0.85)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(psx, psy, breathR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(180,255,230,${0.85 + Math.sin(now * 0.003) * 0.15})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(psx, psy, breathR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#e0fff6';
    ctx.beginPath();
    ctx.arc(psx, psy, player.r + 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── main loop ──
  let lastFrame = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (started && alive) update(dt, now);
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
